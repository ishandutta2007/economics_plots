<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f355da"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="areaGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="areaGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7000ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.85">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#c084fc" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 0.1px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.4px;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>
  
  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="180" fill="#38bdf8" opacity="0.06"/>
  <circle cx="950" cy="200" r="220" fill="#7000ff" opacity="0.08"/>
  <circle cx="600" cy="380" r="150" fill="#10b981" opacity="0.04"/>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(60, 0)">
    <!-- Pill Tag -->
    <g transform="translate(0, 48)">
      <rect width="220" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#00f2fe">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="18" fill="#38bdf8" class="badge-text">DATA INTELLIGENCE SUITE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 120)">
      <text class="title-text" fill="#ffffff">
        Economics <tspan fill="url(#accentCyan)">&amp;</tspan> Global
      </text>
      <text y="52" class="title-text" fill="url(#glowGrad)">
        Data Visualizations
      </text>
    </g>

    <!-- Subtitle / Mission -->
    <g transform="translate(0, 218)">
      <text class="subtitle-text">
        Transforming complex global datasets into insightful, interactive,
      </text>
      <text y="24" class="subtitle-text">
        and animated visual stories powered by Python &amp; World Bank data.
      </text>
    </g>

    <!-- Category Badges -->
    <g transform="translate(0, 290)">
      <!-- Badge 1: Macroeconomics -->
      <g transform="translate(0, 0)">
        <rect width="136" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" fill="#38bdf8" font-size="14">&#127757;</text>
        <text x="36" y="21" fill="#e2e8f0" class="badge-text">Macro &amp; GDP</text>
      </g>

      <!-- Badge 2: Tech & AI -->
      <g transform="translate(146, 0)">
        <rect width="142" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" fill="#c084fc" font-size="14">&#128187;</text>
        <text x="36" y="21" fill="#e2e8f0" class="badge-text">Tech &amp; AI Trends</text>
      </g>

      <!-- Badge 3: Geopolitics & Energy -->
      <g transform="translate(298, 0)">
        <rect width="146" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <text x="14" y="21" fill="#34d399" font-size="14">&#9889;</text>
        <text x="36" y="21" fill="#e2e8f0" class="badge-text">Energy &amp; Trade</text>
      </g>
    </g>

    <!-- Bottom Metrics / Mini Highlights -->
    <g transform="translate(0, 362)">
      <text fill="#64748b" class="badge-text">
        <tspan fill="#38bdf8" font-weight="700">50+</tspan> Open-Source Scripts &#8226; 
        <tspan fill="#a855f7" font-weight="700">Dynamic</tspan> Matplotlib &amp; Pandas &#8226; 
        <tspan fill="#34d399" font-weight="700">HD Video</tspan> Animations &amp; Plots
      </text>
    </g>
  </g>

  <!-- Right Side: Graphic Visualizations / Interactive Chart Elements -->
  <g id="chartVisualization">
    <!-- Chart Background Glassmorphism Panel -->
    <rect x="640" y="45" width="500" height="330" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    
    <!-- Top Bar in Window -->
    <line x1="640" y1="85" x2="1140" y2="85" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="665" cy="65" r="5" fill="#ef4444" opacity="0.85"/>
    <circle cx="680" cy="65" r="5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="695" cy="65" r="5" fill="#10b981" opacity="0.85"/>
    
    <text x="720" y="69" fill="#64748b" class="mono-text">global_convergence_trajectory.py</text>
    
    <!-- Status Live Indicator -->
    <g transform="translate(1025, 56)">
      <rect width="95" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
      <circle cx="10" cy="10" r="3.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="14" fill="#10b981" class="badge-text" font-size="10">LIVE DYNAMIC</text>
    </g>

    <!-- Chart Grid Lines -->
    <g opacity="0.3">
      <line x1="680" y1="120" x2="1100" y2="120" stroke="#475569" stroke-dasharray="4,4"/>
      <line x1="680" y1="180" x2="1100" y2="180" stroke="#475569" stroke-dasharray="4,4"/>
      <line x1="680" y1="240" x2="1100" y2="240" stroke="#475569" stroke-dasharray="4,4"/>
      <line x1="680" y1="300" x2="1100" y2="300" stroke="#475569" stroke-dasharray="4,4"/>
      <line x1="680" y1="340" x2="1100" y2="340" stroke="#64748b" stroke-width="1.5"/>
    </g>

    <!-- Shaded Areas Under Curves -->
    <path d="M 680 340 L 680 290 Q 740 280, 800 230 T 920 200 T 1020 120 T 1100 100 L 1100 340 Z" fill="url(#areaGrad1)"/>
    <path d="M 680 340 L 680 310 Q 760 300, 840 260 T 960 170 T 1040 150 T 1100 140 L 1100 340 Z" fill="url(#areaGrad2)"/>

    <!-- Bar Chart Elements (Background Comparison with SMIL Animations) -->
    <g>
      <rect x="710" y="270" width="14" height="70" rx="3" fill="rgba(56, 189, 248, 0.25)">
        <animate attributeName="height" values="70;78;70" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="270;262;270" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="770" y="240" width="14" height="100" rx="3" fill="rgba(56, 189, 248, 0.3)">
        <animate attributeName="height" values="100;112;100" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="240;228;240" dur="4.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="830" y="210" width="14" height="130" rx="3" fill="rgba(56, 189, 248, 0.35)">
        <animate attributeName="height" values="130;142;130" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="210;198;210" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="890" y="190" width="14" height="150" rx="3" fill="rgba(56, 189, 248, 0.4)">
        <animate attributeName="height" values="150;164;150" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="190;176;190" dur="4.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="950" y="160" width="14" height="180" rx="3" fill="rgba(56, 189, 248, 0.45)">
        <animate attributeName="height" values="180;194;180" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="160;146;160" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="1010" y="130" width="14" height="210" rx="3" fill="rgba(56, 189, 248, 0.5)">
        <animate attributeName="height" values="210;224;210" dur="5.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="130;116;130" dur="5.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="1070" y="110" width="14" height="230" rx="3" fill="rgba(56, 189, 248, 0.55)">
        <animate attributeName="height" values="230;245;230" dur="4.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="110;95;110" dur="4.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Dynamic Main Trend Line (Cyan - Emerging Trend) -->
    <path d="M 680 290 Q 740 280, 800 230 T 920 200 T 1020 120 T 1100 100" 
          fill="none" 
          stroke="url(#accentCyan)" 
          stroke-width="3.5" 
          stroke-linecap="round"
          stroke-dasharray="12, 6">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- Dynamic Second Trend Line (Purple/Magenta - Projection) -->
    <path d="M 680 310 Q 760 300, 840 260 T 960 170 T 1040 150 T 1100 140" 
          fill="none" 
          stroke="url(#accentPurple)" 
          stroke-width="2.5" 
          stroke-linecap="round"
          stroke-dasharray="6, 6">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- Glowing Nodes on Curve 1 -->
    <!-- Node 1 -->
    <g transform="translate(800, 230)">
      <circle cx="0" cy="0" r="4" fill="#00f2fe"/>
      <circle cx="0" cy="0" r="8" stroke="#00f2fe" stroke-width="1.5" fill="none">
        <animate attributeName="r" values="4;16;4" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Node 2 -->
    <g transform="translate(920, 200)">
      <circle cx="0" cy="0" r="4" fill="#00f2fe"/>
    </g>

    <!-- Node 3 (Peak) -->
    <g transform="translate(1080, 105)">
      <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#00f2fe" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="10" stroke="#00f2fe" stroke-width="1.5" fill="none">
        <animate attributeName="r" values="6;20;6" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Glowing Nodes on Curve 2 -->
    <g transform="translate(960, 170)">
      <circle cx="0" cy="0" r="5" fill="#f355da">
        <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="10" stroke="#f355da" stroke-width="1.5" fill="none">
        <animate attributeName="r" values="5;18;5" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Floating Tooltip Card 1 (Macro Metric) -->
    <g transform="translate(870, 95)">
      <animateTransform attributeName="transform" type="translate" values="870,95; 870,88; 870,95" dur="5s" repeatCount="indefinite"/>
      <rect width="138" height="54" rx="8" fill="#0b1329" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2"/>
      <text x="12" y="20" fill="#94a3b8" class="badge-text" font-size="9">GDP PPP CONVERGENCE</text>
      <text x="12" y="42" fill="#00f2fe" class="title-text" font-size="17">+142.8%</text>
      <path d="M 104 36 L 112 26 L 120 36" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Floating Tooltip Card 2 (Tech Metric) -->
    <g transform="translate(670, 195)">
      <animateTransform attributeName="transform" type="translate" values="670,195; 670,202; 670,195" dur="6s" repeatCount="indefinite"/>
      <rect width="128" height="48" rx="8" fill="#0b1329" stroke="rgba(243, 85, 218, 0.45)" stroke-width="1.2"/>
      <text x="10" y="18" fill="#94a3b8" class="badge-text" font-size="9">AI / ENERGY INDEX</text>
      <text x="10" y="38" fill="#f355da" class="title-text" font-size="15">4.8x EXP</text>
      <circle cx="108" cy="28" r="4" fill="#f355da">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Border Gradient Accent Frame -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" opacity="0.5"/>
</svg>
